<!DOCTYPE html>

<html lang="en" class="h-full bg-gray-950 text-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PrivateChat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    .chat-container {
      scrollbar-width: thin;
      scrollbar-color: #4b5563 transparent;
    }
    .chat-container::-webkit-scrollbar { width: 4px; }
    .chat-container::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 20px; }


.message-bubble { max-width: 85%; word-break: break-word; }

@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; }
  .sidebar.open { transform: translateX(0); }
  .message-bubble { max-width: 90%; }
}

.spinner {
  border: 3px solid rgba(255,255,255,0.2);
  border-top-color: #3b82f6;
  border-radius: 50%;
  width: 20px; height: 20px;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }


  </style>
</head>
<body class="h-screen overflow-hidden flex flex-col bg-gray-950">

  <!-- LOADING SCREEN -->

  <div id="loading-screen" class="flex-1 flex items-center justify-center bg-gray-950">
    <div class="spinner"></div>
  </div>

  <!-- LOGIN / SIGNUP PAGE -->

  <div id="login-page" class="hidden flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-gray-900 to-black overflow-y-auto">
    <div class="w-full max-w-md p-8 bg-gray-900 rounded-3xl shadow-2xl border border-gray-700 my-4">
      <div class="text-center mb-8">
        <div class="w-20 h-20 mx-auto bg-blue-600 rounded-3xl flex items-center justify-center text-4xl mb-4">🔒</div>
        <h1 class="text-3xl font-bold">PrivateChat</h1>
        <p class="text-gray-400">Secure • Real Accounts</p>
      </div>


  <!-- Toggle Login / Signup -->
  <div class="flex bg-gray-800 rounded-2xl p-1 mb-6">
    <button id="mode-login-btn" onclick="setAuthMode('login')" class="flex-1 py-3 rounded-xl font-medium bg-blue-600 text-white">Log In</button>
    <button id="mode-signup-btn" onclick="setAuthMode('signup')" class="flex-1 py-3 rounded-xl font-medium text-gray-400">Sign Up</button>
  </div>

  <div id="auth-error" class="hidden mb-4 p-3 bg-red-900/40 border border-red-700 rounded-xl text-red-300 text-sm"></div>

  <div class="space-y-4">
    <div id="displayname-field" class="hidden">
      <label class="block text-sm mb-2">Display Name</label>
      <input id="display-name" type="text" class="w-full px-5 py-4 bg-gray-800 border border-gray-700 rounded-2xl focus:outline-none focus:border-blue-500 text-base" placeholder="How others see you">
    </div>
    <div>
      <label class="block text-sm mb-2">Email</label>
      <input id="email" type="email" class="w-full px-5 py-4 bg-gray-800 border border-gray-700 rounded-2xl focus:outline-none focus:border-blue-500 text-base" placeholder="you@example.com">
    </div>
    <div>
      <label class="block text-sm mb-2">Password</label>
      <input id="password" type="password" class="w-full px-5 py-4 bg-gray-800 border border-gray-700 rounded-2xl focus:outline-none focus:border-blue-500 text-base" placeholder="At least 6 characters">
    </div>
    <button id="auth-submit-btn" onclick="handleAuthSubmit()" class="w-full py-4 bg-blue-600 hover:bg-blue-700 rounded-2xl font-semibold text-lg active:scale-95 transition flex items-center justify-center gap-2">
      <span id="auth-submit-text">Log In</span>
      <span id="auth-submit-spinner" class="hidden spinner"></span>
    </button>
  </div>
</div>


  </div>

  <!-- MAIN APP -->

  <div id="main-app" class="hidden h-screen flex flex-col md:flex-row overflow-hidden">


<!-- SIDEBAR -->
<div id="sidebar" class="sidebar w-72 md:w-80 bg-gray-900 border-r border-gray-700 flex flex-col h-full md:relative absolute inset-y-0 left-0 z-50">

  <div class="p-4 border-b border-gray-700 flex items-center justify-between bg-gray-900">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-9 h-9 bg-blue-600 rounded-2xl flex items-center justify-center text-2xl shrink-0">🔒</div>
      <div class="min-w-0">
        <h2 class="font-bold text-lg truncate" id="current-user"></h2>
        <p id="current-user-number" class="text-xs text-green-400"></p>
      </div>
    </div>
    <div class="flex items-center gap-3 shrink-0">
      <button onclick="logout()" title="Log out" class="text-gray-400 hover:text-red-400 text-lg">
        <i class="fas fa-right-from-bracket"></i>
      </button>
      <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white text-xl">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>

  <div class="flex border-b border-gray-700">
    <button onclick="switchTab(0)" id="tab-chats" class="flex-1 py-4 text-center font-medium border-b-2 border-blue-500 text-blue-400">Chats</button>
    <button onclick="switchTab(1)" id="tab-users" class="flex-1 py-4 text-center font-medium text-gray-400">Users</button>
  </div>

  <div id="chats-tab" class="flex-1 overflow-y-auto chat-container p-3 space-y-1"></div>

  <div id="users-tab" class="hidden flex-1 overflow-y-auto chat-container p-4">
    <div class="mb-4 text-xs text-gray-500 px-1">Tap a user to start chatting</div>
    <div id="users-list" class="space-y-2"></div>
  </div>
</div>

<!-- CHAT AREA -->
<div class="flex-1 flex flex-col h-full min-w-0">
  <div class="h-16 bg-gray-900 border-b border-gray-700 px-4 flex items-center justify-between">
    <div class="flex items-center gap-3 min-w-0">
      <button onclick="toggleSidebar()" class="md:hidden text-xl text-gray-400 pr-2">
        <i class="fas fa-bars"></i>
      </button>
      <div id="chat-avatar" class="w-9 h-9 bg-purple-600 rounded-2xl flex items-center justify-center text-2xl shrink-0"></div>
      <div class="min-w-0">
        <p id="chat-name" class="font-semibold text-base truncate">Select a chat</p>
        <p id="chat-status" class="text-xs text-gray-500"></p>
      </div>
    </div>
  </div>

  <div id="messages" class="flex-1 overflow-y-auto chat-container p-4 md:p-6 bg-gray-950 space-y-4"></div>

  <div class="p-4 bg-gray-900 border-t border-gray-700">
    <div class="flex gap-2">
      <input id="message-input" type="text"
             class="flex-1 bg-gray-800 border border-gray-700 rounded-3xl px-6 py-4 focus:outline-none focus:border-blue-500 text-base"
             placeholder="Type message..." onkeypress="if(event.key==='Enter') sendMessage()" disabled>
      <button onclick="sendMessage()"
              class="w-14 h-14 bg-blue-600 hover:bg-blue-700 rounded-3xl flex items-center justify-center text-xl active:scale-95 transition">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
    <p class="text-center text-[10px] text-gray-600 mt-3">End-to-end app messaging</p>
  </div>
</div>


  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import {
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
      onAuthStateChanged, signOut, updateProfile
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
    import {
      getFirestore, doc, setDoc, getDoc, getDocs, collection, query,
      where, orderBy, onSnapshot, addDoc, serverTimestamp, limit
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAN2iDg0QJaUweMmgKHkN53j5qCvE6lfMM",
      authDomain: "privatechat-83c05.firebaseapp.com",
      projectId: "privatechat-83c05",
      storageBucket: "privatechat-83c05.firebasestorage.app",
      messagingSenderId: "738424965551",
      appId: "1:738424965551:web:65453174b7b2179ba7c75a",
      measurementId: "G-30SZMRN6XM"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ---------- State ----------
    let authMode = "login";
    let currentUserData = null; // { uid, displayName, email, appNumber }
    let allUsers = [];          // other users (from Firestore 'users' collection)
    let activeChatUser = null;  // the user object currently chatting with
    let isSidebarOpen = false;
    let unsubMessages = null;   // live listener cleanup for messages
    let unsubUsers = null;

    window.setAuthMode = function (mode) {
      authMode = mode;
      const loginBtn = document.getElementById('mode-login-btn');
      const signupBtn = document.getElementById('mode-signup-btn');
      const nameField = document.getElementById('displayname-field');
      const submitText = document.getElementById('auth-submit-text');

      if (mode === 'login') {
        loginBtn.classList.add('bg-blue-600', 'text-white');
        loginBtn.classList.remove('text-gray-400');
        signupBtn.classList.remove('bg-blue-600', 'text-white');
        signupBtn.classList.add('text-gray-400');
        nameField.classList.add('hidden');
        submitText.textContent = 'Log In';
      } else {
        signupBtn.classList.add('bg-blue-600', 'text-white');
        signupBtn.classList.remove('text-gray-400');
        loginBtn.classList.remove('bg-blue-600', 'text-white');
        loginBtn.classList.add('text-gray-400');
        nameField.classList.remove('hidden');
        submitText.textContent = 'Sign Up';
      }
      hideAuthError();
    };

    function showAuthError(msg) {
      const el = document.getElementById('auth-error');
      el.textContent = msg;
      el.classList.remove('hidden');
    }
    function hideAuthError() {
      document.getElementById('auth-error').classList.add('hidden');
    }
    function setAuthLoading(loading) {
      document.getElementById('auth-submit-btn').disabled = loading;
      document.getElementById('auth-submit-spinner').classList.toggle('hidden', !loading);
    }

    // Generate a unique in-app "phone number", e.g. +234-APP-482913
    function generateAppNumber() {
      const digits = Math.floor(100000 + Math.random() * 900000);
      return `+234-APP-${digits}`;
    }

    window.handleAuthSubmit = async function () {
      hideAuthError();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showAuthError("Please fill in email and password.");
        return;
      }
      if (password.length < 6) {
        showAuthError("Password must be at least 6 characters.");
        return;
      }

      setAuthLoading(true);
      try {
        if (authMode === 'signup') {
          const displayName = document.getElementById('display-name').value.trim();
          if (!displayName) {
            showAuthError("Please enter a display name.");
            setAuthLoading(false);
            return;
          }
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          await updateProfile(cred.user, { displayName });

          const appNumber = generateAppNumber();
          await setDoc(doc(db, "users", cred.user.uid), {
            uid: cred.user.uid,
            displayName,
            email,
            appNumber,
            avatar: pickAvatar(),
            createdAt: serverTimestamp()
          });
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
        // onAuthStateChanged will take it from here
      } catch (err) {
        setAuthLoading(false);
        showAuthError(friendlyAuthError(err.code));
        return;
      }
    };

    function friendlyAuthError(code) {
      const map = {
        'auth/email-already-in-use': 'That email is already registered. Try logging in.',
        'auth/invalid-email': 'That email address looks invalid.',
        'auth/weak-password': 'Password is too weak (min 6 characters).',
        'auth/user-not-found': 'No account found with that email.',
        'auth/wrong-password': 'Incorrect password.',
        'auth/invalid-credential': 'Incorrect email or password.',
        'auth/too-many-requests': 'Too many attempts. Try again later.'
      };
      return map[code] || 'Something went wrong. Please try again.';
    }

    const AVATARS = ["😀","😎","🦁","🐼","🐸","🦊","🐧","🐵","🦋","🐙","🌟","🔥","⚡","🌈","🍀","🎯"];
    function pickAvatar() {
      return AVATARS[Math.floor(Math.random() * AVATARS.length)];
    }

    // ---------- Auth state ----------
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (!snap.exists()) {
          // Edge case: auth user exists but no profile doc — sign out.
          await signOut(auth);
          return;
        }
        currentUserData = snap.data();
        showMainApp();
        listenToUsers();
      } else {
        currentUserData = null;
        showLoginPage();
        if (unsubUsers) unsubUsers();
        if (unsubMessages) unsubMessages();
      }
    });

    function showLoginPage() {
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('main-app').classList.add('hidden');
      document.getElementById('login-page').classList.remove('hidden');
      document.getElementById('login-page').classList.add('flex');
      setAuthLoading(false);
    }

    function showMainApp() {
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('login-page').classList.add('hidden');
      document.getElementById('main-app').classList.remove('hidden');

      document.getElementById('current-user').textContent = currentUserData.displayName;
      document.getElementById('current-user-number').textContent = currentUserData.appNumber;
    }

    window.logout = async function () {
      await signOut(auth);
      activeChatUser = null;
    };

    // ---------- Users list (live) ----------
    function listenToUsers() {
      const q = collection(db, "users");
      unsubUsers = onSnapshot(q, (snap) => {
        allUsers = [];
        snap.forEach(d => {
          const u = d.data();
          if (u.uid !== currentUserData.uid) allUsers.push(u);
        });
        renderUsersList();
        renderChatsList();
      });
    }

    function chatIdFor(otherUid) {
      // deterministic chat id regardless of who initiates
      return [currentUserData.uid, otherUid].sort().join("_");
    }

    function renderUsersList() {
      const container = document.getElementById('users-list');
      if (allUsers.length === 0) {
        container.innerHTML = `<p class="text-gray-500 text-sm text-center mt-8">No other users yet. Invite someone to sign up!</p>`;
        return;
      }
      container.innerHTML = allUsers.map(u => `
        <div class="flex items-center gap-3 p-3 hover:bg-gray-800 rounded-2xl cursor-pointer" onclick="openChatWith('${u.uid}')">
          <div class="w-10 h-10 bg-gray-700 rounded-2xl flex items-center justify-center text-2xl shrink-0">${u.avatar || '👤'}</div>
          <div class="flex-1 min-w-0">
            <p class="font-medium truncate">${escapeHtml(u.displayName)}</p>
            <p class="text-xs text-gray-400">${u.appNumber}</p>
          </div>
        </div>
      `).join('');
    }

    // For "Chats" tab we just show all known users too (simplest v1: every user is a potential/existing chat)
    function renderChatsList() {
      const container = document.getElementById('chats-tab');
      if (allUsers.length === 0) {
        container.innerHTML = `<p class="text-gray-500 text-sm text-center mt-8 px-2">No chats yet. Go to the Users tab to start one.</p>`;
        return;
      }
      container.innerHTML = allUsers.map(u => `
        <div class="flex items-center gap-3 p-3 hover:bg-gray-800 rounded-2xl cursor-pointer ${activeChatUser && activeChatUser.uid === u.uid ? 'bg-gray-800' : ''}" onclick="openChatWith('${u.uid}')">
          <div class="w-10 h-10 bg-gray-700 rounded-2xl flex items-center justify-center text-2xl shrink-0">${u.avatar || '👤'}</div>
          <div class="flex-1 min-w-0">
            <p class="font-medium truncate">${escapeHtml(u.displayName)}</p>
            <p class="text-xs text-gray-400 truncate">${u.appNumber}</p>
          </div>
        </div>
      `).join('');
    }

    window.switchTab = function (n) {
      document.getElementById('chats-tab').classList.toggle('hidden', n !== 0);
      document.getElementById('users-tab').classList.toggle('hidden', n !== 1);

      const tabChats = document.getElementById('tab-chats');
      const tabUsers = document.getElementById('tab-users');

      tabChats.classList.toggle('border-b-2', n === 0);
      tabChats.classList.toggle('border-blue-500', n === 0);
      tabChats.classList.toggle('text-blue-400', n === 0);
      tabChats.classList.toggle('text-gray-400', n !== 0);

      tabUsers.classList.toggle('text-blue-400', n === 1);
      tabUsers.classList.toggle('text-gray-400', n !== 1);
    };

    window.toggleSidebar = function () {
      const sidebar = document.getElementById('sidebar');
      isSidebarOpen = !isSidebarOpen;
      sidebar.classList.toggle('open', isSidebarOpen);
    };

    // ---------- Chat ----------
    window.openChatWith = function (otherUid) {
      const user = allUsers.find(u => u.uid === otherUid);
      if (!user) return;
      activeChatUser = user;

      document.getElementById('chat-avatar').textContent = user.avatar || '👤';
      document.getElementById('chat-name').textContent = user.displayName;
      document.getElementById('chat-status').textContent = user.appNumber;
      document.getElementById('message-input').disabled = false;

      switchTab(0);
      renderChatsList();

      if (window.innerWidth < 768 && isSidebarOpen) toggleSidebar();

      listenToMessages();
    };

    function listenToMessages() {
      if (unsubMessages) unsubMessages();
      const chatId = chatIdFor(activeChatUser.uid);
      const q = query(
        collection(db, "chats", chatId, "messages"),
        orderBy("createdAt", "asc"),
        limit(200)
      );
      unsubMessages = onSnapshot(q, (snap) => {
        const messages = [];
        snap.forEach(d => messages.push(d.data()));
        renderMessages(messages);
      });
    }

    function renderMessages(messages) {
      const container = document.getElementById('messages');
      if (messages.length === 0) {
        container.innerHTML = `<p class="text-gray-600 text-sm text-center mt-8">Say hello 👋</p>`;
        return;
      }
      container.innerHTML = messages.map(msg => {
        const isMe = msg.senderId === currentUserData.uid;
        const time = msg.createdAt && msg.createdAt.toDate
          ? msg.createdAt.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          : '';
        return `
          <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
            <div class="message-bubble ${isMe ? 'bg-blue-600 text-white' : 'bg-gray-800'} rounded-3xl px-5 py-3">
              <p class="text-[15px] leading-relaxed">${escapeHtml(msg.text)}</p>
              <p class="text-[10px] text-right mt-1 opacity-70">${time}</p>
            </div>
          </div>
        `;
      }).join('');
      container.scrollTop = container.scrollHeight;
    }

    window.sendMessage = async function () {
      if (!activeChatUser) return;
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      const chatId = chatIdFor(activeChatUser.uid);

      await addDoc(collection(db, "chats", chatId, "messages"), {
        text,
        senderId: currentUserData.uid,
        recipientId: activeChatUser.uid,
        createdAt: serverTimestamp()
      });
    };

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    document.addEventListener('click', (e) => {
      if (window.innerWidth < 768) {
        const sidebar = document.getElementById('sidebar');
        if (sidebar && !sidebar.contains(e.target) && !e.target.closest('button')) {
          sidebar.classList.remove('open');
          isSidebarOpen = false;
        }
      }
    });

    window.addEventListener('resize', () => {
      if (!document.getElementById('main-app').classList.contains('hidden')) {
        const m = document.getElementById('messages');
        m.scrollTop = m.scrollHeight;
      }
    });
  </script>

</body>
</html>
